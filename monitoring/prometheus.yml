global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cloud-cadvisor"
    static_configs:
      - targets: ["localhost:8081"]

  - job_name: "cloud-api"
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "edge-cadvisor"
    static_configs:
      - targets: ["192.168.122.32:8081"]

  - job_name: "edge-node"
    static_configs:
      - targets: ["192.168.122.32:9100"]

  - job_name: "edge-ebpf"
    static_configs:
      - targets: ["192.168.122.32:9435"]

  - job_name: "edge-buffer"
    static_configs:
      - targets: ["192.168.122.32:9105"]

  - job_name: "host-rapl"
    static_configs:
      - targets: ["localhost:9106"]
